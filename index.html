<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="upper-info">
            <p>----Bundle & Save----</p>
        </div>
        <div class="upper-mid-info">
            <div class="box " id="box1">
                <div class="box-inner-info">
                    <div class="con">
                        <input type="radio" name="product-option" value="1pair">                        
                        <div>
                            <h3>1 Pair</h3>
                            <h3>DKK 195.00</h3>
                        </div>
                    </div>
                    <div>
                        <h3>50% OFF</h3>
                    </div>
                </div>
                <div class="lower-info-size">
                    <div>
                        <p>Size</p>
                        <select>
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                        </select>
                    </div>
                    <div>
                        <p>Color</p>
                        <select>
                            <option>Color</option>
                            <option>Red</option>
                            <option>Pink</option>
                            <option>Black</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="box" id="box2">
                <div class="box-inner-info">
                    <div class="con">
                        <input type="radio" name="product-option" value="2pair">                        
                        <div>
                            <h3>1 Pair</h3>
                            <h3>DKK 195.00</h3>
                        </div>
                    </div>
                    <div>
                        <h3>50% OFF</h3>
                    </div>
                </div>
                <div class="lower-info-size">
                    <div>
                        <p>Size</p>
                        <select>
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                        </select>
                    </div>
                    <div>
                        <p>Color</p>
                        <select>
                            <option>Color</option>
                            <option>Red</option>
                            <option>Pink</option>
                            <option>Black</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="box" id="box3">
                <div class="box-inner-info">
                    <div class="con">
                        <input type="radio" name="product-option" value="3pair">                        
                        <div>
                            <h3>1 Pair</h3>
                            <h3>DKK 195.00</h3>
                        </div>
                    </div>
                    <div>
                        <h3>50% OFF</h3>
                    </div>
                </div>
                <div class="lower-info-size">
                    <div>
                        <p>Size</p>
                        <select>
                            <option>S</option>
                            <option>M</option>
                            <option>L</option>
                        </select>
                    </div>
                    <div>
                        <p>Color</p>
                        <select>
                            <option>Color</option>
                            <option>Red</option>
                            <option>Pink</option>
                            <option>Black</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="lower-info">
            <p class="free">Free 2 Day Shipping</p>
            <p>Total : <span class="dkk">DKK 360.00</span></p>
        </div>
        <div>
            <button class="btn" onclick="checkSelected()">+Add to Cart</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('input[name="product-option"]').forEach((input) => {
                input.addEventListener('change', function () {
                    document.querySelectorAll('.box').forEach(div => div.classList.remove('expanded'));
                    const outerDiv = this.closest('.box');
                    if (outerDiv) {
                        outerDiv.classList.add('expanded');
                    }
                });
            });

            document.querySelectorAll('.box').forEach(optionDiv => {
                optionDiv.addEventListener('click', function () {

                    const radio = this.querySelector('input[type="radio"]');
                    if (radio) radio.checked = true;

                    document.querySelectorAll('.box').forEach(div => div.classList.remove('expanded'));

                    this.classList.add('expanded');
                });
            });
        </script>
</body>
</html>
